send_anonymous_usage_stats: true
project_id: "tap-newmode"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-newmode"
    namespace: "tap_newmode"
    pip_url: -e .
    capabilities:
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: client_id
      label: Client ID
      description: New/Mode OAuth client id
      sensitive: true

    - name: client_secret
      label: Client Secret
      description: New/Mode OAuth client secret
      sensitive: true

    - name: api_base_url
      label: API Base URL
      description: New/Mode API base URL

    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: Initial date to start extracting data from

    - name: _refresh_token_via_hg_api
      kind: boolean
      label: Refresh Token Via Hotglue API
      description: Fetch access tokens from the Hotglue access token endpoint

    - name: access_token
      label: Access Token
      description: Current access token, managed by the tap
      sensitive: true

    - name: expires_in
      kind: integer
      label: Token Expiry
      description: Epoch seconds when the access token expires, managed by the tap

    settings_group_validation:
    - [client_id, client_secret]

    config:
      api_base_url: https://base.newmode.net
      _refresh_token_via_hg_api: false

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
